<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!-- Alpha test: the RDA Pass stamp on a transparent page, rendered as a .mov so it can be checked against
         what tools/bake.py composites for 'overlay' shots (ProRes 4444 with alpha). Rendered by bakeoff.mjs. -->
    <script src="assets/js/gsap.min.js"></script>
    <script src="assets/js/CustomEase.min.js"></script>
    <style>
      @font-face { font-family: "RDA Display"; src: url("assets/fonts/BricolageGrotesque-var.woff2") format("woff2"); font-weight: 200 800; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 1920px; height: 1080px; }
      .stamp {
        position: absolute; top: 120px; right: 140px; font: 800 92px/1 "RDA Display", system-ui, sans-serif;
        letter-spacing: 0.06em; text-transform: uppercase; color: #1d7a43; background: rgba(255, 255, 255, 0.85);
        border: 7.67px solid #1d7a43; border-radius: 10px; padding: 18.4px 31.28px;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="2" data-width="1920" data-height="1080">
      <div class="stamp clip" id="stamp" data-start="0" data-duration="2">Pass</div>
    </div>
    <script>
      gsap.registerPlugin(CustomEase);
      CustomEase.create("rdaOut", "0.22,0.72,0.28,1");
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#stamp", { opacity: 0, scale: 1.6, rotation: -4 }, { opacity: 1, scale: 1, rotation: -4, duration: 0.3, ease: "rdaOut" }, 0.5);
      tl.to({}, { duration: 0 }, 2);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
